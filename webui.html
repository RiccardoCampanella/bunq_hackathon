        }

            color: #00aeff;

            padding-bottom: 10px;
            margin-top: 0;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #00aeff;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00aeff;
            color: #fff;
            border-radius: 5px;
            appearance: none;
            -webkit-appearance: none;
        }

        button {
            background: #00aeff;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #0088cc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 174, 255, 0.3);
        }
    </style>
</head>

    <div class="container">

        </div>

        <div class="section">
            <h2>Transaction Overview</h2>
            <div class="input-group">
                <label>Total Transactions (Fixed)</label>
                <input type="number" id="totalTransactions" value="4" readonly>
            </div>
        </div>

        <div class="section">
            <h2>Geographical Insights</h2>
            <div class="input-group">
                <label>Cities (comma-separated)</label>
                <input type="text" id="cities" required>
            </div>
            <div class="input-group">
                <label>Transaction Spread (km)</label>
                <input type="number" id="transactionSpread" step="0.01" required>
            </div>
        </div>

        <div class="section">
            <h2>Subscription Info</h2>
            <div class="input-group">
                <label>Total Subscriptions</label>
                <input type="number" id="totalSubscriptions" required>
            </div>
            <div class="input-group">
                <label>Monthly Cost Breakdown (Currency:Amount, comma-separated)</label>
                <input type="text" id="monthlyCosts" placeholder="EUR:1348.10,SEK:16187.83" required>
            </div>
        </div>

        <div class="section">
            <h2>Salary Transaction</h2>
            <div class="input-group">
                <label>Timestamp</label>
                <input type="datetime-local" id="salaryTimestamp" required>
            </div>
            <div class="input-group">
                <label>Amount</label>
                <input type="number" id="salaryAmount" step="0.01" required>
            </div>
            <div class="input-group">
                <label>Transaction Type</label>
                <select id="transactionType" required>
                    <option value="RENT">RENT</option>
                    <option value="MASTER CARD">MASTER CARD</option>
                    <option value="BILLING">BILLING</option>
                    <option value="REVERSAL">REVERSAL</option>
                    <option value="TRANSFER PAYMENT">TRANSFER PAYMENT</option>
                    <option value="PAYROLL">PAYROLL</option>
                    <option value="TOP UP">TOP UP</option>
                    <option value="REQUEST">REQUEST</option>
                </select>
            </div>
        </div>

        <button onclick="generateJSON()">Generate Insights Report</button>
    </div>

            const modifiedData = JSON.parse(JSON.stringify(baseData));

            // Update transaction overview
            modifiedData[569].rental_info.financial_metrics.total_transactions = 
                parseInt(document.getElementById('totalTransactions').value);

            // Update geographical insights
            modifiedData[569].rental_info.geographical_insights = {
                cities: document.getElementById('cities').value.split(',').map(c => c.trim()),
                transaction_spread_km: parseFloat(document.getElementById('transactionSpread').value)
            };

            // Update subscription info
            modifiedData[569].subscription_info = {
                total_subscriptions: parseInt(document.getElementById('totalSubscriptions').value),
                monthly_cost_breakdown: Object.fromEntries(
                    document.getElementById('monthlyCosts').value.split(',').map(item => {
                        const [currency, amount] = item.split(':');
                        return [currency.trim(), parseFloat(amount)];
                    })
                )
            };

            // Update first salary transaction
            modifiedData[569].salary_transactions[0] = {
                ...modifiedData[569].salary_transactions[0],
                timestamp: new Date(document.getElementById('salaryTimestamp').value).toISOString(),
                amount: parseFloat(document.getElementById('salaryAmount').value),
                financial_metadata: {
                    ...modifiedData[569].salary_transactions[0].financial_metadata,
                    transaction_type: document.getElementById('transactionType').value
                }
            };

            // Create and download JSON
            const json = JSON.stringify(modifiedData, null, 2);
            const blob = new Blob([json], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'llm_demo_data.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
